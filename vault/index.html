<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Vault | Vanilla Case List</title>
  <meta name="description" content="Browse Ace Attorney fan case documents as a linked case file. Profiles, evidence and scene notes, cross referenced." />

  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../images/favicon-180.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Case Vault | Vanilla Case List" />
  <meta property="og:description" content="Browse Ace Attorney fan case documents as a linked case file." />
  <meta property="og:image" content="https://lublurrr.github.io/Vanilla-Case-List/images/vcl-logo.png" />
  <meta property="og:image:alt" content="Vanilla Case List logo" />
  <meta name="theme-color" content="#0a2563" />

  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="vault.css" />
</head>

<body class="vault-page">
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">
        <a href="../index.html"><img class="site-logo" src="../images/vcl-logo.png"
            alt="Vanilla Case List — A compilation of the best Vanilla cases!" /></a>
      </h1>
      <p class="site-credits">
        Case Vault<br>
        <small>Case documents, read as a linked case file</small>
      </p>
    </div>
  </header>

  <nav class="resources-nav" aria-label="Related resources">
    <div class="resources-inner">
      <a class="resource-link" href="../index.html">
        <span class="resource-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg></span>
        <span class="resource-text"><strong>Back to the case list</strong><span>Every case on VCL</span></span>
      </a>
      <a class="resource-link" href="https://discord.gg/5VwA7zTpvv" target="_blank" rel="noopener noreferrer">
        <span class="resource-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg></span>
        <span class="resource-text"><strong>Casing Hub Discord</strong><span>Updates &amp; community</span></span>
      </a>
    </div>
  </nav>

  <main class="vault" id="vault">
    <button class="vault-sidebar-toggle" id="sidebar-toggle" type="button" aria-expanded="false"
      aria-controls="vault-sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6h16" />
        <path d="M4 12h16" />
        <path d="M4 18h16" />
      </svg>
      <span>Case contents</span>
    </button>

    <aside class="vault-sidebar" id="vault-sidebar" aria-label="Case contents">
      <div class="vault-case-head" id="vault-case-head"></div>
      <div class="vault-search">
        <label class="visually-hidden" for="vault-search-input">Search this case</label>
        <input type="search" id="vault-search-input" placeholder="Search this case" autocomplete="off" />
      </div>
      <nav class="vault-tree" id="vault-tree" aria-label="Notes"></nav>
    </aside>

    <section class="vault-main" id="vault-main" aria-live="polite">
      <div class="note-card">
        <p class="vault-loading">Opening the case file...</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Case documents remain the property of their respective creators.</p>
    <p class="footer-small">Only open the role document you are playing.</p>
  </footer>

  <script src="vault.js"></script>
</body>

</html>
